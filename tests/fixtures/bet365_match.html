<!DOCTYPE html>
<html>
<!-- Replica of bet365's match-page shots milestone grids, matching the
     structure confirmed from the live site: a player column plus one
     "N+" milestone column each, one odds cell per player (suspended cells
     have no odds), where "N+" == Over (N-0.5). Used to test the parser
     without touching the real site. -->
<head><title>bet365</title></head>
<body>
  <div class="sph-EventHeader_Label">Liverpool v Arsenal</div>

  <!-- Player Shots: columns 1+, 2+, 3+ -->
  <div class="gl-MarketGroupPod srb-HScrollFixtureSubGroupWithShowMore">
    <div class="srb-ButtonWithBetBuilderIcon_Text">Player Shots</div>
    <div class="gl-MarketGroupContainer">
      <div class="srb-HScrollParticipantMarket gl-Market gl-Market_General">
        <div class="srb-HScrollParticipantHeader">Player / Last 5</div>
        <div class="srb-ParticipantLabelWithTeam"><div class="srb-ParticipantLabelWithTeam_Name">Mohamed Salah</div></div>
        <div class="srb-ParticipantLabelWithTeam"><div class="srb-ParticipantLabelWithTeam_Name">Bukayo Saka</div></div>
      </div>
      <div class="gl-Market gl-Market_General gl-Market_General-columnheader">
        <div class="gl-MarketColumnHeader">1+</div>
        <div class="gl-ParticipantOddsOnly"><span class="gl-ParticipantOddsOnly_Odds">1.20</span></div>
        <div class="gl-ParticipantOddsOnly"><span class="gl-ParticipantOddsOnly_Odds">1.30</span></div>
      </div>
      <div class="gl-Market gl-Market_General gl-Market_General-columnheader">
        <div class="gl-MarketColumnHeader">2+</div>
        <div class="gl-ParticipantOddsOnly"><span class="gl-ParticipantOddsOnly_Odds">2.10</span></div>
        <div class="gl-ParticipantOddsOnly"><span class="gl-ParticipantOddsOnly_Odds">2.50</span></div>
      </div>
      <div class="gl-Market gl-Market_General gl-Market_General-columnheader">
        <div class="gl-MarketColumnHeader">3+</div>
        <div class="gl-ParticipantOddsOnly"><span class="gl-ParticipantOddsOnly_Odds">4.00</span></div>
        <!-- Saka suspended at 3+: no odds -->
        <div class="gl-ParticipantOddsOnly gl-ParticipantOddsOnly_Suspended"></div>
      </div>
    </div>
  </div>

  <!-- Player Shots On Target: column 1+ -->
  <div class="gl-MarketGroupPod srb-HScrollFixtureSubGroupWithShowMore">
    <div class="srb-ButtonWithBetBuilderIcon_Text">Player Shots On Target</div>
    <div class="gl-MarketGroupContainer">
      <div class="srb-HScrollParticipantMarket gl-Market gl-Market_General">
        <div class="srb-ParticipantLabelWithTeam"><div class="srb-ParticipantLabelWithTeam_Name">Mohamed Salah</div></div>
      </div>
      <div class="gl-Market gl-Market_General gl-Market_General-columnheader">
        <div class="gl-MarketColumnHeader">1+</div>
        <div class="gl-ParticipantOddsOnly"><span class="gl-ParticipantOddsOnly_Odds">1.85</span></div>
      </div>
    </div>
  </div>

  <!-- Over/Under and other variants must be ignored (title mismatch). -->
  <div class="gl-MarketGroupPod gl-MarketGroup">
    <div class="cm-MarketGroupWithIconsButton_Text">Player Shots Over/Under</div>
    <div class="gl-MarketGroupContainer">
      <div class="srb-HScrollParticipantMarket gl-Market">
        <div class="srb-ParticipantLabelWithTeam"><div class="srb-ParticipantLabelWithTeam_Name">Mohamed Salah</div></div>
      </div>
      <div class="gl-Market gl-Market_General">
        <div class="gl-MarketColumnHeader">2+</div>
        <div class="gl-ParticipantOddsOnly"><span class="gl-ParticipantOddsOnly_Odds">9.99</span></div>
      </div>
    </div>
  </div>
</body>
</html>
